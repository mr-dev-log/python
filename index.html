<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python · Recurso interactivo</title>
<style>
/* ===== Tokens: laboratorio nocturno, tinta azul y reactivos neón ===== */
:root{--bg:#0a1220;--panel:#121c30;--line:#24334f;--txt:#e6edf7;--mut:#8ea0bf;--cy:#2de2c8;--am:#ffc857;--ok:#3ddc84;--bad:#ff5d73;--vi:#8b7bff;
--mono:"JetBrains Mono","Fira Code",Consolas,Menlo,monospace;--sans:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.5;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0,rgba(10,18,32,.55),var(--bg) 75%);z-index:-1}
header{padding:18px 20px 10px;max-width:1000px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand .lg{font-size:40px;filter:drop-shadow(0 0 10px var(--cy))}
h1{margin:0;font-family:var(--mono);font-size:clamp(28px,5vw,42px);letter-spacing:-1px}
.sub{color:var(--cy);margin:0;font-size:15px}
.stats{margin-left:auto;text-align:right;font-family:var(--mono);font-size:14px}
.stats b{color:var(--am);font-size:22px}
.bar{height:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--vi));transition:width .6s cubic-bezier(.2,.8,.2,1)}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font:700 14px var(--mono);cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--cy);color:var(--txt)}
.chip.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 12px rgba(45,226,200,.35)}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#06210f}
main{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:10px 20px 30px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.card.enter{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card h2{margin:0 0 4px;font-size:24px}
.tag{font:12px var(--mono);color:var(--vi)}
.info{background:rgba(139,123,255,.1);border-left:3px solid var(--vi);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.goal{background:rgba(255,200,87,.1);border-left:3px solid var(--am);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
pre.code{margin:14px 0;background:#070d19;border:1px solid var(--line);border-radius:12px;padding:16px;font:15px/2.2 var(--mono);overflow-x:auto;white-space:pre}
.slot{display:inline-block;min-width:70px;min-height:32px;padding:0 8px;line-height:30px;text-align:center;vertical-align:middle;border:2px dashed var(--mut);border-radius:8px;transition:.2s;color:var(--cy);font-weight:700}
.slot.over{border-color:var(--cy);background:rgba(45,226,200,.15);transform:scale(1.08)}
.slot.full{border-style:solid;border-color:var(--cy);background:rgba(45,226,200,.1);cursor:pointer}
.slot.pop{animation:pop .3s}
.slot.good{border-color:var(--ok);background:rgba(61,220,132,.18);color:var(--ok)}
.slot.bad{border-color:var(--bad);background:rgba(255,93,115,.18);color:var(--bad)}
.slot.bad.shake{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bank{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;padding:14px;border:1px dashed var(--line);border-radius:12px;background:rgba(0,0,0,.2)}
.bank.over{border-color:var(--cy)}
.blk{padding:7px 14px;border-radius:9px;background:linear-gradient(135deg,#1d2c4a,#27385c);border:1px solid #3a5083;font:700 14px var(--mono);cursor:grab;user-select:none;transition:.15s}
.blk:hover{transform:translateY(-3px);border-color:var(--cy)}
.blk.sel{border-color:var(--am);box-shadow:0 0 12px rgba(255,200,87,.5);transform:translateY(-3px)}
.blk.drag{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
button.b{padding:10px 18px;border:0;border-radius:10px;font:700 14px var(--sans);cursor:pointer;color:#05231d;background:var(--cy);transition:.15s}
button.b:hover{transform:translateY(-2px);filter:brightness(1.1)}
button.b.g{background:transparent;color:var(--txt);border:1px solid var(--line)}
button.b.a{background:var(--am);color:#2a1d00}
button.b:disabled{opacity:.35;cursor:not-allowed;transform:none}
.meta{margin-left:auto;font:13px var(--mono);color:var(--mut)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:600}
.fb.new{animation:in .3s}
.fb.ok{background:rgba(61,220,132,.15);color:var(--ok)}
.fb.bad{background:rgba(255,93,115,.15);color:var(--bad)}
.fb.hint{background:rgba(255,200,87,.12);color:var(--am)}
.home{text-align:center;padding:30px 10px}
.home .big{font-size:64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:18px 0}
.bd{padding:12px;border:1px solid var(--line);border-radius:12px;text-align:center;font-size:13px}
.bd span{display:block;font-size:30px}
.bd.off{opacity:.3;filter:grayscale(1)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
footer{text-align:center;padding:16px;color:var(--mut);font-size:13px;border-top:1px solid var(--line);background:rgba(10,18,32,.8)}
.fx{position:fixed;pointer-events:none;font-size:22px;z-index:9;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
button:focus-visible,.blk:focus-visible,.slot:focus-visible{outline:2px solid var(--am);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:560px){.stats{display:none}.card{padding:14px}pre.code{font-size:13px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="lg">🐍</div>
    <div><h1>Python - Mr. Dev Log</h1><p class="sub">Recurso interactivo</p></div>
    <div class="stats">Puntos <b id="score">0</b><br><span id="cnt">0/10 retos</span></div>
  </div>
  <div class="bar"><i id="pb"></i></div>
  <nav id="nav" aria-label="Ejercicios"></nav>
</header>
<main id="app"></main>
<footer>Desarrollado por Mr. Dev Log y Aliens</footer>

<script>
/* =========================================================
   DATOS: cada ejercicio define su código con huecos [[respuesta]].
   "d" son bloques distractores. Las respuestas se validan por
   posición (hueco 1, hueco 2...) comparando el texto del bloque.
   ========================================================= */
const E=[
{t:"Variables",ic:"📦",bd:"Guardián de datos",
 ex:"Una variable es una caja con nombre que guarda un valor. Se crea con el signo = (asignación).",
 ch:"Completa el programa para guardar el nombre y la edad, y luego mostrar el nombre.",
 code:`[[nombre]] = "Ximena"\nedad = [[25]]\nprint([[nombre]])`,d:['"Ximena"','print','texto'],
 h:"La variable que se imprime es la misma que se creó en la primera línea."},
{t:"Tipos de datos",ic:"🧬",bd:"Biólogo del código",
 ex:"Python tiene tipos: int (enteros), float (decimales) y bool (True o False). type() indica el tipo de un valor.",
 ch:"Escribe en cada línea un valor que coincida con el tipo indicado en el comentario.",
 code:`a = [[10]]      # int\nb = [[3.1416]]     # float\nc = [[True]]    # bool\nprint(type([[a]]))`,d:['"10"','hola','len'],
 h:"Los decimales llevan punto, y los booleanos empiezan con mayúscula."},
{t:"Operadores",ic:"➕",bd:"Maestro del cálculo",
 ex:"Operadores: + suma, % da el residuo de una división y > compara. Una comparación devuelve True o False.",
 ch:"Calcula la suma y el residuo de 8 y 3, y compara si la suma es mayor que el residuo.",
 code:`a = 8\nb = 3\nsuma = a [[+]] b\nresto = a [[%]] b\nprint(suma [[>]] resto)`,d:['-','//','=='],
 h:"8 % 3 vale 2. La suma vale 11."},
{t:"Salida con print",ic:"🖨️",bd:"Voz del programa",
 ex:"print() muestra información en pantalla. El operador + puede unir (concatenar) textos.",
 ch:"Muestra el saludo «Hola, Esteban» uniendo un texto con la variable.",
 code:`nombre = "Esteban"\n[[print]]("Hola, " [[+]] nombre)`,d:['input','-','int'],
 h:"Se necesita la función que muestra y el operador que une textos."},
{t:"Captura de datos",ic:"⌨️",bd:"Oído atento",
 ex:"input() pide un dato al usuario y siempre devuelve texto. Para usarlo como número se convierte con int().",
 ch:"Pide el nombre y la edad (convertida a entero) y muestra ambos.",
 code:`nombre = [[input]]("¿Cómo te llamas? ")\nedad = [[int]]([[input]]("Edad: "))\nprint("Tienes", edad, "años")`,d:['print','str','float'],
 h:"int() envuelve a input() para convertir el texto en número."},
{t:"Condicional IF / ELSE",ic:"🔀",bd:"Tomador de decisiones",
 ex:"if ejecuta un bloque si la condición es verdadera; else lo hace en caso contrario. Ambos terminan en dos puntos.",
 ch:"Muestra «Aprobado» si la nota es 6 o más, y «Reprobado» si no.",
 code:`nota = 7\n[[if]] nota >= 6[[:]]\n    print("Aprobado")\n[[else]]:\n    print("Reprobado")`,d:['elif','while',';'],
 h:"La condición inicia con if y la línea termina en dos puntos."},
{t:"Ciclo FOR",ic:"🔁",bd:"Repetidor incansable",
 ex:"for repite instrucciones. range(a, b) genera los números desde a hasta b-1.",
 ch:"Imprime los números 1, 2 y 3.",
 code:`for i in [[range]]([[1]], [[4]]):\n    print(i)`,d:['0','5','while'],
 h:"El límite superior de range no se incluye."},
{t:"Ciclo WHILE",ic:"⏳",bd:"Cuenta regresiva",
 ex:"while repite mientras su condición sea verdadera. Hay que modificar la variable para que el ciclo termine.",
 ch:"Haz una cuenta regresiva de 3 a 1.",
 code:`contador = 3\n[[while]] contador [[>]] 0:\n    print(contador)\n    contador [[-=]] 1`,d:['for','<','+='],
 h:"Si contador aumentara, el ciclo nunca terminaría."},
{t:"Par o impar",ic:"🧠",bd:"Mente lógica",
 ex:"Un número es par si el residuo de dividirlo entre 2 es 0. Con input() pedimos el dato, int() lo convierte a número y if / else decide qué mensaje mostrar.",
 ch:"Completa el programa que pide un número y dice si es par o impar.",
 code:`numero = [[int]]([[input]]("Ingresa un número: "))\n\n[[if]] numero [[%]] 2 [[==]] 0:\n    print("El número es par")\n[[else]]:\n    print("El número es impar")`,d:['str','print','elif','//'],
 h:"input() va dentro de int(). Para comparar igualdad se usan dos signos igual."},
{t:"Función de registro",ic:"📝",bd:"Creador de funciones",
 ex:"Una función agrupa instrucciones con def y se ejecuta al llamarla por su nombre seguido de paréntesis. Aquí se combinan input() para capturar datos y print() para mostrarlos.",
 ch:"Completa la función registro(): captura los datos, muestra el resumen y llámala al final.",
 code:`[[def]] registro():\n    print("Ingresa los siguientes datos para tu registro")\n\n    nombre = [[input]]("Ingresa tu nombre: ")\n    edad = [[input]]("Ingresa tu edad: ")\n    ciudad = input("Ingresa tu ciudad: ")\n    correo = input("Ingresa tu correo electrónico: ")\n\n    print("\\n--- Datos de registro ---")\n    print("Nombre:", [[nombre]])\n    print("Edad:", [[edad]])\n    print("Ciudad:", [[ciudad]])\n    print("Correo:", [[correo]])\n\n    print("\\n¡Registro completado!")\n\n\n[[registro]]()`,d:['return','int','class','print'],
 h:"Cada print muestra la variable que se guardó en la línea de input con el mismo nombre. La función se llama al final con su nombre."}
];

/* ===== Utilidades y estado ===== */
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let cur='home',sel=null,dragId=null;

// Prepara respuestas, bloques mezclados y estado independiente por ejercicio
E.forEach(e=>{
  e.a=[...e.code.matchAll(/\[\[(.+?)\]\]/g)].map(m=>m[1]);
  e.b=shuffle([...e.a,...e.d].map((t,id)=>({id,t})));
});
const fresh=e=>({sl:e.a.map(()=>null),st:e.a.map(()=>''),at:0,hn:0,done:false,pts:0,fb:'',fc:''});
const S=E.map(fresh);

/* ===== Navegación y progreso ===== */
let fx={}; // efectos de un solo uso (pop, shake, aparición del mensaje)
function go(v){cur=v;sel=null;scrollTo(0,0);render(true)}
function total(){return S.reduce((a,s)=>a+s.pts,0)}
function doneCount(){return S.filter(s=>s.done).length}
function header(){
  $('#score').textContent=total();
  $('#cnt').textContent=doneCount()+'/10 retos';
  $('#pb').style.width=doneCount()*10+'%';
  $('#nav').innerHTML=E.map((e,i)=>`<button class="chip ${S[i].done?'ok':''} ${cur===i?'on':''}" onclick="go(${i})" title="${e.t}" aria-label="Ejercicio ${i+1}: ${e.t}">${i+1}</button>`).join('');
}

/* ===== Render de pantallas ===== */
/* render conserva el scroll y solo anima al cambiar de pantalla */
function render(enter){
  const y=scrollY;paint();
  const c=$('#app').firstElementChild;if(enter&&c)c.classList.add('enter');
  if(!enter)scrollTo(0,y);
  fx={};
}
function paint(){
  header();
  const m=$('#app');
  if(cur==='home')return m.innerHTML=`<div class="card home"><div class="big">🧪</div>
    <h2>Laboratorio de programación</h2>
    <p>Arrastra los bloques hasta los espacios vacíos para completar 10 programas. Si usas pantalla táctil, toca un bloque y luego toca el espacio.</p>
    <p>Cada reto vale hasta 100 puntos: pierdes 20 por cada intento fallido y 10 por cada pista.</p>
    <button class="b" onclick="go(0)">Empezar el reto 1</button></div>`;
  if(cur==='end')return renderEnd(m);
  const e=E[cur],s=S[cur];let k=0;
  const code=esc(e.code).replace(/\[\[(.+?)\]\]/g,()=>{
    const i=k++,id=s.sl[i];
    return `<span class="slot ${id!==null?'full':''} ${s.st[i]} ${fx.pop===i?'pop':''} ${fx.shake?'shake':''}" data-s="${i}" ${id!==null?`draggable="true" data-b="${id}" tabindex="0"`:'tabindex="0"'}>${id!==null?esc(e.b.find(b=>b.id===id).t):'&nbsp;'}</span>`});
  const free=e.b.filter(b=>!s.sl.includes(b.id));
  m.innerHTML=`<div class="card">
    <span class="tag">Reto ${cur+1} de 10 · ${e.ic} ${e.t}</span><h2>${e.t}</h2>
    <div class="info"><b>Concepto:</b> ${e.ex}</div>
    <div class="goal"><b>Tu reto:</b> ${e.ch}</div>
    <pre class="code">${code}</pre>
    <div class="bank" id="bank">${free.length?free.map(b=>`<div class="blk ${sel===b.id?'sel':''}" draggable="true" data-b="${b.id}" tabindex="0">${esc(b.t)}</div>`).join(''):'<span style="color:var(--mut)">Todos los bloques están en el código. Toca uno para devolverlo.</span>'}</div>
    <div class="row">
      <button class="b" onclick="check()" ${s.done?'disabled':''}>Comprobar</button>
      <button class="b a" onclick="hint()" ${s.done?'disabled':''}>Pista</button>
      <button class="b g" onclick="resetEx()">Reiniciar reto</button>
      <span class="meta">Intentos: ${s.at} · Pistas: ${s.hn} · ${s.pts} pts</span>
    </div>
    ${s.fb?`<div class="fb ${s.fc} ${fx.fb?'new':''}">${s.fb}</div>`:''}
    <div class="row">
      ${cur>0?`<button class="b g" onclick="go(${cur-1})">Anterior</button>`:''}
      <button class="b ${s.done?'':'g'}" style="margin-left:auto" onclick="go(${cur<9?cur+1:"'end'"})">${cur<9?'Siguiente reto':'Ver resultados'}</button>
    </div></div>`;
}

/* ===== Lógica de bloques: colocar / devolver ===== */
function place(id,i){
  const s=S[cur];if(s.done)return;
  const old=s.sl.indexOf(id);if(old>-1)s.sl[old]=null;   // un bloque solo puede estar en un hueco
  s.sl[i]=id;s.st=s.st.map(()=>'');s.fb='';sel=null;fx={pop:i};render();
}
function unplace(id){
  const s=S[cur];if(s.done)return;
  const i=s.sl.indexOf(id);if(i>-1){s.sl[i]=null;s.st=s.st.map(()=>'');render()}
}

/* ===== Comprobar, pista, reinicio ===== */
function check(){
  const e=E[cur],s=S[cur];
  if(s.sl.includes(null)){s.fb='Aún hay espacios vacíos. Completa todos antes de comprobar.';s.fc='hint';fx={fb:true};return render()}
  s.at++;fx={fb:true,shake:true};
  s.st=s.sl.map((id,i)=>e.b.find(b=>b.id===id).t===e.a[i]?'good':'bad');
  const ok=s.st.filter(x=>x==='good').length;
  if(ok===e.a.length){
    s.done=true;s.pts=Math.max(20,100-20*(s.at-1)-10*s.hn);
    s.fc='ok';s.fb=`¡Correcto! Programa completo en ${s.at} intento(s). Ganaste ${s.pts} puntos y la insignia «${e.bd}» ${e.ic}.`+(s.at===1&&s.hn===0?' ⚡ ¡Reto perfecto!':'');
    render();boom();
  }else{
    s.fc='bad';s.fb=`${ok} de ${e.a.length} espacios son correctos. Revisa los marcados en rojo e inténtalo otra vez.`;render();
  }
}
function hint(){
  const s=S[cur];s.hn++;s.fc='hint';s.fb='💡 Pista (−10 pts): '+E[cur].h;fx={fb:true};render();
}
function resetEx(){S[cur]=fresh(E[cur]);sel=null;E[cur].b=shuffle(E[cur].b);render()} // no toca los demás retos

/* ===== Pantalla final ===== */
function renderEnd(m){
  const max=1000,t=total(),p=Math.round(t/max*100);
  const rank=p>=90?'🏆 Maestro Pythonista':p>=70?'🥇 Programador avanzado':p>=40?'🥈 Aprendiz constante':'🥉 Explorador del código';
  const perfect=S.filter(s=>s.done&&s.at===1&&s.hn===0).length;
  m.innerHTML=`<div class="card home"><div class="big">${doneCount()===10?'🎉':'📋'}</div>
    <h2>${rank}</h2>
    <p><b style="color:var(--am);font-size:30px">${t}</b> / ${max} puntos · ${doneCount()}/10 retos · ${perfect} perfectos</p>
    ${doneCount()<10?'<p>Aún tienes retos pendientes: vuelve a ellos desde los números de arriba.</p>':''}
    <div class="grid">${E.map((e,i)=>`<div class="bd ${S[i].done?'':'off'}"><span>${e.ic}</span>${e.bd}</div>`).join('')}</div>
    <table><tr><th>Reto</th><th>Intentos</th><th>Pistas</th><th>Puntos</th></tr>
    ${E.map((e,i)=>`<tr><td>${i+1}. ${e.t}</td><td>${S[i].at}</td><td>${S[i].hn}</td><td>${S[i].pts}</td></tr>`).join('')}</table>
    <div class="row" style="justify-content:center"><button class="b" onclick="resetAll()">Reiniciar todo</button><button class="b g" onclick="go(0)">Revisar retos</button></div></div>`;
  if(doneCount()===10)boom();
}
function resetAll(){E.forEach((e,i)=>{S[i]=fresh(e);e.b=shuffle(e.b)});go('home')}

/* ===== Efecto de celebración ===== */
function boom(){
  for(let i=0;i<26;i++){
    const d=document.createElement('span');d.className='fx';d.textContent=['✨','🐍','⭐','💚'][i%4];
    d.style.left=innerWidth/2+'px';d.style.top=innerHeight/2+'px';
    d.style.setProperty('--x',(Math.random()-.5)*700+'px');d.style.setProperty('--y',(Math.random()-.8)*500+'px');
    document.body.appendChild(d);setTimeout(()=>d.remove(),1200);
  }
}

/* ===== Eventos (delegación): arrastrar y soltar + toque ===== */
const app=$('#app');
app.addEventListener('dragstart',ev=>{
  const el=ev.target.closest('[data-b]');if(!el)return;
  dragId=+el.dataset.b;ev.dataTransfer.setData('text/plain',dragId);ev.dataTransfer.effectAllowed='move';el.classList.add('drag');
});
app.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.drag,.over').forEach(x=>x.classList.remove('drag','over'))});
app.addEventListener('dragover',ev=>{
  const t=ev.target.closest('.slot,.bank');if(!t)return;ev.preventDefault();
  document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));t.classList.add('over');
});
app.addEventListener('drop',ev=>{
  const t=ev.target.closest('.slot,.bank');if(!t||dragId===null)return;ev.preventDefault();
  t.classList.contains('slot')?place(dragId,+t.dataset.s):unplace(dragId);
});
function activate(ev){
  const slot=ev.target.closest('.slot'),blk=ev.target.closest('.blk');
  if(slot){
    const i=+slot.dataset.s;
    if(sel!==null)place(sel,i);                       // bloque elegido -> hueco
    else if(S[cur].sl[i]!==null)unplace(S[cur].sl[i]);// clic en hueco lleno -> lo devuelve
  }else if(blk){sel=sel===+blk.dataset.b?null:+blk.dataset.b;render()}
}
app.addEventListener('click',activate);
app.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){if(ev.target.matches('.slot,.blk')){ev.preventDefault();activate(ev)}}});

render(true);
</script>
